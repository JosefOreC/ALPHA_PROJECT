name: CI
on:
  push:
    branches: [main, develop, inspection5/sprint4]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: 'python -m pip install --only-binary=:all: --require-hashes -r scripts/requirements-ci.lock'
      - run: python -m pip check
      - run: python -m compileall -q src/backend
      - run: python scripts/check_docs.py
      - run: npm ci --ignore-scripts --prefix src/frontend
      - run: npm run lint --prefix src/frontend
      - run: npm exec --prefix src/frontend -- tsc -p src/frontend/tsconfig.ui.json
      - name: Compilar frontend y empaquetar la imagen de despliegue
        run: docker build --tag ecologistica-ci:validation .
