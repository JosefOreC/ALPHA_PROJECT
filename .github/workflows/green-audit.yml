name: Green Audit (Lighthouse CI)

# Auditoría automatizada de rendimiento, accesibilidad, buenas prácticas y SEO
# del frontend (React + Vite) con Lighthouse CI. Configuración en lighthouserc.json.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: green-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LHCI_VERSION: 0.15.1

jobs:
  lighthouse:
    name: Auditoría Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar dependencias del frontend
        # Instalación reproducible desde package-lock.json, sin scripts de ciclo de vida.
        run: npm ci --ignore-scripts --prefix src/frontend

      - name: Compilar frontend de producción
        working-directory: src/frontend
        run: npm run build

      - name: Ejecutar Lighthouse CI (collect, assert, upload)
        # Chrome viene preinstalado en ubuntu-latest; LHCI sirve src/frontend/dist.
        run: npx --yes "@lhci/cli@${LHCI_VERSION}" autorun --config=./lighthouserc.json

      - name: Resumen de puntuaciones
        if: always() && hashFiles('reports/lighthouse/manifest.json') != ''
        shell: python
        run: |
          import json, os
          runs = json.load(open('reports/lighthouse/manifest.json', encoding='utf-8'))
          rep = next((r for r in runs if r.get('isRepresentativeRun')), runs[-1])
          names = {'performance': 'Rendimiento', 'accessibility': 'Accesibilidad',
                   'best-practices': 'Buenas prácticas', 'seo': 'SEO'}
          lines = ['## Green Audit — Lighthouse CI', '',
                   f"URL auditada: `{rep['url']}` (ejecución representativa de {len(runs)})", '',
                   '| Categoría | Puntuación |', '|---|---|']
          for key, label in names.items():
              score = rep['summary'].get(key)
              lines.append(f"| {label} | {'—' if score is None else round(score * 100)} |")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('\n'.join(lines) + '\n')

      - name: Guardar reportes Lighthouse
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-reports-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/lighthouse/
            .lighthouseci/
          include-hidden-files: true
