name: SonarCloud y seguridad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Pruebas y SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Instalar dependencias
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r scripts/requirements-ci.lock
          npm ci --ignore-scripts --prefix src/frontend
      - name: Pruebas y cobertura Python
        run: >-
          python -m pytest src/backend/tests -q -p no:cacheprovider
          --cov --cov-config=.coveragerc
          --cov-report=xml:reports/coverage/backend.xml
          --cov-report=json:reports/coverage/backend.json
          --junitxml=reports/tests/backend.xml
      - name: Cobertura Python mínima del 90 % en líneas y ramas
        run: python scripts/check_python_coverage.py
      - name: Pruebas y cobertura TypeScript
        working-directory: src/frontend
        run: npm run test:coverage
      - name: Compilar frontend
        working-directory: src/frontend
        run: npm run build
      - name: Validar configuración SonarCloud
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::Falta el secret SONAR_TOKEN en Settings > Secrets and variables > Actions.'
            exit 1
          fi
      - name: SonarCloud y Quality Gate
        id: sonar
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
      - name: Exportar resultados SonarCloud incluso si falla el Quality Gate
        if: always() && !cancelled() && steps.sonar.outcome != 'skipped' && hashFiles('.scannerwork/report-task.txt') != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: JosefOreC_ALPHA_PROJECT
          SONAR_BRANCH: ${{ github.head_ref || github.ref_name }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: python scripts/export_sonar_report.py
      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonar-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: |
            reports/
            src/frontend/coverage/lcov.info
            src/frontend/coverage/coverage-summary.json

  audit:
    name: Auditoría complementaria OWASP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Instalar herramientas y dependencias
        run: |
          mkdir -p reports/security
          python -m pip install --only-binary=:all: --require-hashes -r scripts/requirements-ci.lock
          python -m pip freeze > reports/security/python-environment.txt
          npm ci --ignore-scripts --prefix src/frontend
      - name: Bandit (alertas medias y altas)
        if: success() || failure()
        run: python -m bandit -r src/backend scripts src/frontend/scripts -x src/backend/tests -ll -f json -o reports/security/bandit.json
      - name: Dependencias Python instaladas
        if: success() || failure()
        run: python -m pip_audit --local --format json --output reports/security/pip-audit.json
      - name: Dependencias frontend (incluye desarrollo)
        if: success() || failure()
        working-directory: src/frontend
        run: npm audit --audit-level=high --json > ../../reports/security/npm-audit.json
      - name: Guardar auditorías aunque existan hallazgos
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-audits-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: reports/security/
