# Organization and project key are supplied by GitHub Actions variables or CLI.
sonar.projectName=EcoLogistica Lima - ALPHA_PROJECT
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14

# Include operational code, database scripts, shared policies and CI configuration.
sonar.sources=src/backend,src/frontend/src,src/frontend/index.html,src/frontend/public,scripts,src/shared,.github
sonar.tests=src/backend/tests,src/frontend/src,src/frontend/tests
sonar.test.inclusions=src/backend/tests/**,src/frontend/src/**/*.test.ts,src/frontend/src/**/*.test.tsx,src/frontend/src/test/**,src/frontend/tests/**
sonar.exclusions=src/backend/tests/**,src/frontend/src/**/*.test.ts,src/frontend/src/**/*.test.tsx,src/frontend/src/test/**,**/__pycache__/**,**/node_modules/**,**/coverage/**,**/dist/**,src/frontend/public/maps/**

sonar.python.coverage.reportPaths=reports/coverage/backend.xml
sonar.javascript.lcov.reportPaths=src/frontend/coverage/lcov.info
sonar.coverage.exclusions=src/frontend/src/vite-env.d.ts
