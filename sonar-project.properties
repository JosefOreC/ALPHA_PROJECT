# Identificación del proyecto
sonar.projectKey=ecologistica
sonar.projectName=EcoLogistica
sonar.projectVersion=1.0

# Codificación
sonar.sourceEncoding=UTF-8

# Código fuente de producción
sonar.sources=src/backend/application,src/backend/domain,src/backend/infrastructure,src/backend/interfaces,src/frontend/src,src/shared

# Directorios de pruebas
sonar.tests=src/backend/tests,src/frontend/src,src/frontend/tests

# Identificación de pruebas
sonar.test.inclusions=src/backend/tests/**/*.py,src/frontend/src/**/*.test.ts,src/frontend/src/**/*.test.tsx,src/frontend/src/**/*.spec.ts,src/frontend/src/**/*.spec.tsx,src/frontend/tests/**/*.test.cjs

# Excluir archivos y directorios innecesarios
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.pytest_cache/**,**/__pycache__/**,**/*.d.ts,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Cobertura backend Python
sonar.python.coverage.reportPaths=src/backend/coverage.xml

# Cobertura frontend JavaScript / TypeScript
sonar.javascript.lcov.reportPaths=src/frontend/coverage/lcov.info